# Adopt this blueprint in the Render dashboard to apply infrastructure settings.
# For an existing service, preserve its database and back it up before changing DATABASE_URL.
services:
  - type: web
    name: ai-credit-approval-system
    runtime: python
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.14
      - key: APP_PASSWORD
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: COOKIE_SECURE
        value: "true"
      - key: OPENAI_MODEL
        value: gpt-4.1-mini
